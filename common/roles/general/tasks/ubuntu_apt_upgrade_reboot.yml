- name: apt upgrade
  become: true
  block:
    ### block start
    - name: set defaults
      ansible.builtin.set_fact:
        reboot_auto: false
        reboot_force: false

    - name: apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: apt list upgradable
      ansible.builtin.apt:
        upgrade: true
      check_mode: true
      register: general_aptlistupgradable_result

    - name: apt list upgradable
      ansible.builtin.debug:
        msg: >-
          {{
            general_aptlistupgradable_result.stdout_lines
            | select('match', '^Inst')
            | map('regex_replace', '^Inst (\\S+).*', '\\1')
            | list 
          }}
      when: general_aptlistupgradable_result.stdout_lines is defined

    - name: apt upgrade
      ansible.builtin.apt:
        upgrade: full

    - name: apt autoremove
      ansible.builtin.apt:
        autoremove: true

    - name: check reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: debug
      ansible.builtin.debug:
        msg: 'reboot required, use variable reboot_auto: true or reboot_force: true for reboot'
      when: reboot_required_file.stat.exists is true

    - name: reboot
      ansible.builtin.reboot:
      when: >-
        (reboot_required_file.stat.exists is true and reboot_auto | bool is true) or
        reboot_force is true
    ### block end
